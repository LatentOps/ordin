version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # virtualenv requires filelock <4; revisit when upstream supports v4.
      - dependency-name: filelock
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # virtualenv requires filelock <4; revisit when upstream supports v4.
      - dependency-name: filelock
        update-types: ["version-update:semver-major"]
