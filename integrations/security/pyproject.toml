[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin-security"
version = "0.1.0"
description = "Ordin Security adapter for explicit offline scanner artifacts."
requires-python = ">=3.10"
dependencies = ["ordin>=0.4.0,<0.5"]
license = { text = "Apache-2.0" }
readme = "README.md"

[tool.setuptools]
packages = ["ordin_security"]

[tool.setuptools.package-data]
ordin_security = ["resources/*.json", "resources/LICENSE.upstream"]
