name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from ordin import __version__ as runtime_version

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          if project_version != runtime_version:
              raise SystemExit(
                  f"version mismatch: pyproject={project_version}, runtime={runtime_version}"
              )

          if os.environ["RELEASE_EVENT"] == "push":
              expected_tag = f"v{project_version}"
              if os.environ["RELEASE_REF"] != expected_tag:
                  raise SystemExit(
                      f"release tag {os.environ['RELEASE_REF']!r} must equal {expected_tag!r}"
                  )

          print(f"validated release version {project_version}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/ordin-release
          /tmp/ordin-release/bin/python -m pip install --upgrade pip
          /tmp/ordin-release/bin/python -m pip install dist/*.whl
          /tmp/ordin-release/bin/ordin doctor
          /tmp/ordin-release/bin/ordin make file runnable --limit 1 --json
          /tmp/ordin-release/bin/python -c "from ordin import Ordin; assert Ordin().review('git status --short').allowed"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ordin-release-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ordin
    permissions:
      id-token: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ordin-release-dist
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
