[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin-swarm"
version = "0.4.0.dev0"
description = "Explicit host-side adapters for Ordin swarm tool mediation."
requires-python = ">=3.10"
dependencies = ["ordin>=0.4.0.dev0,<0.5"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.8,<4"]

[tool.setuptools]
packages = ["ordin_swarm"]
