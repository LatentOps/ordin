name: swarm-frameworks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-sdk:
    name: Installed adapter wheel (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        framework: [base, langgraph, crewai, autogen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes -r requirements/dev-baseline.txt
      - name: Verify isolated wheels and pinned local SDK workflow
        run: python scripts/check_swarm_framework_wheel.py --framework "${{ matrix.framework }}" --workspace "$RUNNER_TEMP/swarm-${{ matrix.framework }}"
