name: swarm-assurance

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-release-evidence:
    name: Installed swarm release evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build and validation tooling
        run: python -m pip install --require-hashes -r requirements/dev-baseline.txt
      - name: Verify conservative release report contracts
        run: python -m pytest -q tests/test_swarm_release_evidence.py tests/test_swarm_release_gate.py
      - name: Collect fixed installed-wheel fixtures and exact source evidence
        run: python scripts/check_swarm_release.py --revision "${{ github.sha }}" --workspace "${{ runner.temp }}/swarm-assurance" --owned-fixture
      - name: Retain data-only evidence and explicit gaps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swarm-assurance-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/swarm-assurance/evidence/*.json
          if-no-files-found: warn
