name: ordin-shell-cleanup

on:
  push:
    branches:
      - rebrand-ordin

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand-ordin
      - name: Rename reviewed execution helper
        shell: python
        run: |
          from pathlib import Path

          for raw in [
              "ordin/shell_integration.py",
              "docs/shell-integration.md",
              "tests/test_shell_integration.py",
          ]:
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              text = text.replace("cgr", "orun")
              path.write_text(text, encoding="utf-8")
      - name: Commit helper rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ordin/shell_integration.py docs/shell-integration.md tests/test_shell_integration.py
          git commit -m "Rename shell review helper to orun"
          git push origin HEAD:rebrand-ordin
