[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin-swarm"
version = "0.4.0.dev0"
description = "Explicit host-side adapters for Ordin swarm tool mediation."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ordin>=0.4.0.dev0,<0.5"]

[project.optional-dependencies]
test-runtime = ["pytest==9.2.0"]
postgres = ["psycopg[binary]>=3.3.8,<4"]
langgraph = ["langgraph==1.2.20", "langgraph-prebuilt==1.1.1", "langchain-core==1.7.6", "pydantic==2.14.2", "uuid-utils>=0.12.0,<1.0"]
autogen = ["autogen-core==0.7.5", "pydantic==2.14.2", "protobuf~=5.29.3"]
telemetry = ["opentelemetry-sdk>=1.45.1,<2"]

[project.scripts]
ordin-swarm-adapter = "ordin_swarm.cli:main"
ordin-swarm-host = "ordin_swarm.host_cli:entrypoint"

[tool.setuptools.packages.find]
include = ["ordin_swarm*"]
namespaces = false

[tool.setuptools.package-data]
ordin_swarm = ["migrations/*.sql", "migrations/*.md"]
