[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin-runtime"
version = "0.1.0"
description = "Ordin Runtime policy, verification, and evidence integration."
requires-python = ">=3.10"
dependencies = ["ordin>=0.4.0.dev0,<0.5"]
license = { text = "Apache-2.0" }
readme = "README.md"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.3,<7"]

[project.scripts]
ordin-runtime = "ordin_runtime.cli:main"

[tool.setuptools]
packages = ["ordin_runtime"]

[tool.setuptools.package-data]
ordin_runtime = ["runtime_identity.json"]
