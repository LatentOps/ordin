name: typefix-ci-branch

on:
  push:
    branches:
      - ci-quality-package-validation

permissions:
  contents: write

jobs:
  typefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-quality-package-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply explicit typing fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "commandgraph/semantic.py",
              "from typing import Protocol, Sequence",
              "from typing import Any, Protocol, Sequence",
          )
          replace(
              "commandgraph/semantic.py",
              "    _model: object",
              "    _model: Any",
          )
          replace(
              "commandgraph/data.py",
              '    command_names = [command.get("command") for command in validation_commands]',
              '    command_names = [\n        name\n        for command in validation_commands\n        if isinstance((name := command.get("command")), str)\n    ]',
          )
          replace(
              "commandgraph/analyzers/filesystem.py",
              "    notes = ()\n    if _broad_permission_mode(mode):",
              "    notes: tuple[str, ...] = ()\n    if _broad_permission_mode(mode):",
          )
          replace(
              "commandgraph/search.py",
              'def expand_query(query: str, synonyms: dict[str, list[str]]) -> Counter[str]:\n    tokens = tokenize(query)\n    expanded: Counter[str] = Counter()\n    for token in tokens:\n        expanded[token] += 2.0\n        for synonym in synonyms.get(token, []):\n            expanded[synonym] += 0.8\n    return expanded',
              'def expand_query(query: str, synonyms: dict[str, list[str]]) -> dict[str, float]:\n    tokens = tokenize(query)\n    expanded: dict[str, float] = {}\n    for token in tokens:\n        expanded[token] = expanded.get(token, 0.0) + 2.0\n        for synonym in synonyms.get(token, []):\n            expanded[synonym] = expanded.get(synonym, 0.0) + 0.8\n    return expanded',
          )
          replace(
              "commandgraph/search.py",
              "    expanded: Counter[str],\n    token_counts: Counter[str],",
              "    expanded: dict[str, float],\n    token_counts: Counter[str],",
          )
          # The signature occurs twice, once for each lexical scorer.
          text = Path("commandgraph/search.py").read_text()
          text = text.replace(
              "    expanded: Counter[str],\n    token_counts: Counter[str],",
              "    expanded: dict[str, float],\n    token_counts: Counter[str],",
          )
          Path("commandgraph/search.py").write_text(text)

          cli = Path("commandgraph/cli.py")
          text = cli.read_text()
          text = text.replace(
              "        review = check_command(args.command, context=context)\n        if args.json:\n            print(json.dumps(review.as_dict(), indent=2))\n        else:\n            print(f\"decision: {review.decision}\")\n            print(f\"risk: {review.risk}\")\n            for reason in review.reasons:\n                print(f\"- {reason}\")\n            if review.safer_next_step:\n                print(f\"safer_next_step: {review.safer_next_step}\")\n        return _review_exit(args, review.decision)",
              "        risk_review = check_command(args.command, context=context)\n        if args.json:\n            print(json.dumps(risk_review.as_dict(), indent=2))\n        else:\n            print(f\"decision: {risk_review.decision}\")\n            print(f\"risk: {risk_review.risk}\")\n            for reason in risk_review.reasons:\n                print(f\"- {reason}\")\n            if risk_review.safer_next_step:\n                print(f\"safer_next_step: {risk_review.safer_next_step}\")\n        return _review_exit(args, risk_review.decision)",
          )
          text = text.replace(
              "        review = review_command(\n            command,\n            intent=intent,\n            context=context,\n            trace=trace,\n        )\n        if args.json:\n            print(json.dumps(review.as_dict(), indent=2))\n        else:\n            print(f\"decision: {review.decision}\")\n            print(f\"risk: {review.risk}\")\n            for reason in review.reasons:\n                print(f\"- {reason}\")\n            if review.related_commands:\n                print(f\"related_commands: {', '.join(review.related_commands)}\")\n            if review.trajectory_categories:\n                print(\"trajectory_categories: \" + \", \".join(review.trajectory_categories))\n            if review.safer_next_step:\n                print(f\"safer_next_step: {review.safer_next_step}\")\n        return _review_exit(args, review.decision)",
              "        command_review = review_command(\n            command,\n            intent=intent,\n            context=context,\n            trace=trace,\n        )\n        if args.json:\n            print(json.dumps(command_review.as_dict(), indent=2))\n        else:\n            print(f\"decision: {command_review.decision}\")\n            print(f\"risk: {command_review.risk}\")\n            for reason in command_review.reasons:\n                print(f\"- {reason}\")\n            if command_review.related_commands:\n                print(f\"related_commands: {', '.join(command_review.related_commands)}\")\n            if command_review.trajectory_categories:\n                print(\"trajectory_categories: \" + \", \".join(command_review.trajectory_categories))\n            if command_review.safer_next_step:\n                print(f\"safer_next_step: {command_review.safer_next_step}\")\n        return _review_exit(args, command_review.decision)",
          )
          cli.write_text(text)
      - name: Format changes
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format commandgraph tests
      - name: Commit type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commandgraph
          git commit -m "Fix staged mypy boundary types"
          git push origin HEAD:ci-quality-package-validation
