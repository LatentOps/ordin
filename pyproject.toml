[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commandgraph"
version = "0.1.0"
description = "Intent-aware command discovery and safety checks for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LatentOps" }]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[project.scripts]
commandgraph = "commandgraph.entrypoint:main"
cmdgraph = "commandgraph.entrypoint:main"

[tool.setuptools]
packages = ["commandgraph", "commandgraph.analyzers"]

[tool.setuptools.package-data]
commandgraph = ["resources/*.json", "resources/**/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
