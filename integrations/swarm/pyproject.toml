[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin-swarm"
version = "0.4.0.dev0"
description = "Explicit host-side adapters for Ordin swarm tool mediation."
requires-python = ">=3.10"
dependencies = ["ordin>=0.4.0.dev0,<0.5"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.8,<4"]
langgraph = ["langgraph==1.2.20", "langgraph-prebuilt==1.1.1", "langchain-core==1.7.6", "pydantic==2.12.5"]
crewai = ["crewai==1.15.35", "crewai-core==1.15.35", "pydantic==2.12.5"]
autogen = ["autogen-core==0.7.5", "pydantic==2.12.5"]

[project.scripts]
ordin-swarm-adapter = "ordin_swarm.cli:main"

[tool.setuptools.packages.find]
include = ["ordin_swarm*"]

[tool.setuptools.package-data]
ordin_swarm = ["migrations/*.sql", "migrations/*.md"]
