name: one-off action formatting

on:
  push:
    branches:
      - generic-action-review

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generic-action-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply repository formatter
        run: |
          python -m pip install "ruff==0.16.4"
          python - <<'PY'
          from pathlib import Path

          path = Path("ordin/cli.py")
          text = path.read_text(encoding="utf-8")
          old = '                print(f"effects: {", ".join(action_review.effects)}")\n'
          new = '                print("effects: " + ", ".join(action_review.effects))\n'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format ordin/action.py ordin/cli.py
          ruff check ordin/action.py ordin/cli.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ordin/action.py ordin/cli.py
          git commit -m "Format generic action implementation"
          git push origin HEAD:generic-action-review
