name: swarm-corpus

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-corpus:
    name: Installed corpus and owned kernel evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build and test tooling
        run: python -m pip install --require-hashes -r requirements/dev-baseline.txt
      - name: Check generated schedules and conservative fault handling
        run: python -m pytest -q tests/test_swarm_properties.py tests/test_swarm_faults.py tests/test_swarm_corpus.py tests/test_swarm_corpus_runtime.py
      - name: Verify installed artifact, kernel lane, and predeclared performance limits
        run: python scripts/check_swarm_corpus_wheel.py --revision "${{ github.sha }}" --workspace "$RUNNER_TEMP/swarm-corpus"
