[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commandgraph"
version = "0.1.0"
description = "Intent-aware command discovery and safety checks for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LatentOps" }]
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]

[project.scripts]
commandgraph = "commandgraph.entrypoint:main"
cmdgraph = "commandgraph.entrypoint:main"

[tool.setuptools]
packages = ["commandgraph", "commandgraph.analyzers"]

[tool.setuptools.package-data]
commandgraph = ["resources/*.json", "resources/**/*.json"]
