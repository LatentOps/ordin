name: coordinator

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-authority:
    name: PostgreSQL multi-host authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install hash-locked tooling and optional driver
        run: |
          python -m pip install --require-hashes -r requirements/dev-baseline.txt
          python -m pip install --require-hashes -r requirements/coordinator-postgres.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test owned PostgreSQL cluster and authenticated hosts
        run: python scripts/check_swarm_coordinator_postgres.py
