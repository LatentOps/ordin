name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: ruff check commandgraph tests
      - name: Format check
        run: ruff format --check commandgraph tests
      - name: Static type check
        run: >-
          mypy
          commandgraph/entrypoint.py
          commandgraph/context.py
          commandgraph/trace.py
          commandgraph/enforcement.py
          commandgraph/availability.py
      - name: Compile package
        run: python -m compileall -q commandgraph

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "setuptools>=68"
          python -m pip install .
      - name: Run tests
        run: pytest -q
      - name: Validate bundled data and graph
        run: python -m commandgraph doctor

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/commandgraph-wheel
          /tmp/commandgraph-wheel/bin/python -m pip install --upgrade pip
          /tmp/commandgraph-wheel/bin/python -m pip install dist/*.whl
          /tmp/commandgraph-wheel/bin/cmdgraph --help > /tmp/commandgraph-help.txt
          /tmp/commandgraph-wheel/bin/cmdgraph doctor
          /tmp/commandgraph-wheel/bin/cmdgraph make file runnable --limit 1 --json > /tmp/commandgraph-search.json
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commandgraph-dist
          path: dist/*
          if-no-files-found: error

  linux-compat:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
            setup: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              git python3 python3-pip python3-venv
          - name: Fedora 42
            image: fedora:42
            setup: dnf install -y git python3 python3-pip
    steps:
      - name: Install distro prerequisites
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: Install CommandGraph in isolated environment
        run: |
          python3 -m venv /tmp/commandgraph-distro
          /tmp/commandgraph-distro/bin/python -m pip install --upgrade pip
          /tmp/commandgraph-distro/bin/python -m pip install .
      - name: Verify local distro detection
        run: |
          /tmp/commandgraph-distro/bin/python - <<'PY'
          from commandgraph.availability import detect_environment

          environment = detect_environment()
          assert environment.os_name == "linux"
          assert environment.distro_id
          print(environment)
          PY
      - name: Smoke-test installed CLI
        run: |
          /tmp/commandgraph-distro/bin/cmdgraph doctor
          /tmp/commandgraph-distro/bin/cmdgraph make file runnable --limit 1 --json
