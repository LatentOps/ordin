version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directories:
      - /
      - /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pydantic-parser:
        applies-to: version-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
      per-dependency:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: dependency-name
