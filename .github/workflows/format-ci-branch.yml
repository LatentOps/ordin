name: format-ci-branch

on:
  push:
    branches:
      - ci-quality-package-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-quality-package-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format Python
        run: ruff format commandgraph tests
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commandgraph tests
          git commit -m "Format Python with Ruff"
          git push origin HEAD:ci-quality-package-validation
