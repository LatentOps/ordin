name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: ruff check ordin tests
      - name: Format check
        run: ruff format --check ordin tests
      - name: Static type check
        run: >-
          mypy
          ordin/entrypoint.py
          ordin/context.py
          ordin/trace.py
          ordin/enforcement.py
          ordin/availability.py
      - name: Compile package
        run: python -m compileall -q ordin
      - name: Enforce Ordin namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [
              Path("ordin"),
              Path("tests"),
              Path("data"),
              Path("schemas"),
              Path("docs"),
              Path("examples"),
              Path("benchmarks"),
              Path("README.md"),
              Path("CONTRIBUTING.md"),
              Path("NOTICE"),
              Path("pyproject.toml"),
              Path(".github/workflows/tests.yml"),
              Path(".github/workflows/release.yml"),
          ]
          forbidden = ("commandgraph", "CommandGraph", "COMMANDGRAPH", "cmdgraph", "command-graph")
          suffixes = {".py", ".md", ".toml", ".json", ".jsonl", ".yml", ".yaml", ".txt"}
          failures = []
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in suffixes and path.name != "NOTICE":
                      continue
                  text = path.read_text(encoding="utf-8")
                  for token in forbidden:
                      if token in text:
                          failures.append(f"{path}: contains legacy token {token!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("Ordin namespace is clean")
          PY

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "setuptools>=68"
          python -m pip install .
      - name: Run tests
        run: pytest -q
      - name: Validate bundled data and graph
        run: python -m ordin doctor

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/ordin-wheel
          /tmp/ordin-wheel/bin/python -m pip install --upgrade pip
          /tmp/ordin-wheel/bin/python -m pip install dist/*.whl
          /tmp/ordin-wheel/bin/ordin --help > /tmp/ordin-help.txt
          /tmp/ordin-wheel/bin/ordin doctor
          /tmp/ordin-wheel/bin/ordin make file runnable --limit 1 --json > /tmp/ordin-search.json
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ordin-dist
          path: dist/*
          if-no-files-found: error

  linux-compat:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
            setup: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              git python3 python3-pip python3-venv
          - name: Fedora 42
            image: fedora:42
            setup: dnf install -y git python3 python3-pip
    steps:
      - name: Install distro prerequisites
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: Install Ordin in isolated environment
        run: |
          python3 -m venv /tmp/ordin-distro
          /tmp/ordin-distro/bin/python -m pip install --upgrade pip
          /tmp/ordin-distro/bin/python -m pip install .
      - name: Verify local distro detection
        run: |
          /tmp/ordin-distro/bin/python - <<'PY'
          from ordin.availability import detect_environment

          environment = detect_environment()
          assert environment.os == "linux"
          assert environment.distro_id
          print(environment)
          PY
      - name: Smoke-test installed CLI
        run: |
          /tmp/ordin-distro/bin/ordin doctor
          /tmp/ordin-distro/bin/ordin make file runnable --limit 1 --json
