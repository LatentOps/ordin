name: one-off generic action plumbing

on:
  push:
    branches:
      - generic-action-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: generic-action-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply narrow plumbing changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "ordin/schema.py",
              '    "review_request": "review-request.v1.schema.json",\n',
              '    "action_envelope": "action-envelope.v1.schema.json",\n'
              '    "action_review": "action-review.v1.schema.json",\n'
              '    "review_request": "review-request.v1.schema.json",\n',
          )
          replace_once(
              "ordin/schema.py",
              '        if isinstance(min_length, int) and len(instance) < min_length:\n'
              '            errors.append(f"{path}: string is shorter than {min_length}")\n',
              '        if isinstance(min_length, int) and len(instance) < min_length:\n'
              '            errors.append(f"{path}: string is shorter than {min_length}")\n'
              '        max_length = schema.get("maxLength")\n'
              '        if isinstance(max_length, int) and len(instance) > max_length:\n'
              '            errors.append(f"{path}: string is longer than {max_length}")\n',
          )
          replace_once(
              "ordin/schema.py",
              '        if isinstance(min_items, int) and len(instance) < min_items:\n'
              '            errors.append(f"{path}: array has fewer than {min_items} items")\n',
              '        if isinstance(min_items, int) and len(instance) < min_items:\n'
              '            errors.append(f"{path}: array has fewer than {min_items} items")\n'
              '        max_items = schema.get("maxItems")\n'
              '        if isinstance(max_items, int) and len(instance) > max_items:\n'
              '            errors.append(f"{path}: array has more than {max_items} items")\n',
          )
          replace_once(
              "ordin/schema.py",
              '    if isinstance(instance, dict):\n'
              '        required = schema.get("required", [])\n',
              '    if isinstance(instance, dict):\n'
              '        max_properties = schema.get("maxProperties")\n'
              '        if isinstance(max_properties, int) and len(instance) > max_properties:\n'
              '            errors.append(f"{path}: object has more than {max_properties} properties")\n'
              '        required = schema.get("required", [])\n',
          )

          replace_once(
              "ordin/cli.py",
              'from .context import ExecutionContext, ReviewRequest\n',
              'from .action import ActionEnvelope, review_action\n'
              'from .context import ExecutionContext, ReviewRequest\n',
          )
          replace_once(
              "ordin/cli.py",
              'def _review_exit(args: argparse.Namespace, decision: str) -> int:\n',
              'def _read_stdin_action_envelope() -> ActionEnvelope:\n'
              '    raw = sys.stdin.read()\n'
              '    if not raw.strip():\n'
              '        raise ValueError("stdin action envelope is empty")\n'
              '    try:\n'
              '        payload = json.loads(raw)\n'
              '    except json.JSONDecodeError as exc:\n'
              '        raise ValueError(f"invalid JSON on stdin: {exc.msg}") from exc\n'
              '    if not isinstance(payload, dict):\n'
              '        raise ValueError("stdin action envelope must be a JSON object")\n'
              '    schema_errors = validate_named_schema("action_envelope", payload)\n'
              '    if schema_errors:\n'
              '        raise ValueError("schema validation failed: " + "; ".join(schema_errors))\n'
              '    return ActionEnvelope.from_dict(payload)\n\n\n'
              'def _review_exit(args: argparse.Namespace, decision: str) -> int:\n',
          )
          replace_once(
              "ordin/cli.py",
              '    doctor_parser = subparsers.add_parser("doctor", help="Check local Ordin data.")\n',
              '    action_parser = subparsers.add_parser(\n'
              '        "action",\n'
              '        help="Review a versioned generic action envelope from stdin.",\n'
              '    )\n'
              '    action_parser.add_argument(\n'
              '        "--stdin",\n'
              '        action="store_true",\n'
              '        required=True,\n'
              '        help="Read an ordin.action_envelope.v1 object from stdin.",\n'
              '    )\n'
              '    action_parser.add_argument("--json", action="store_true")\n'
              '    _add_enforcement_arguments(action_parser)\n\n'
              '    doctor_parser = subparsers.add_parser("doctor", help="Check local Ordin data.")\n',
          )
          replace_once(
              "ordin/cli.py",
              '    if args.command_name == "doctor":\n',
              '    if args.command_name == "action":\n'
              '        try:\n'
              '            action = _read_stdin_action_envelope()\n'
              '        except ValueError as exc:\n'
              '            return _input_error(str(exc), as_json=args.json)\n'
              '        action_review = review_action(action)\n'
              '        if args.json:\n'
              '            print(json.dumps(action_review.as_dict(), indent=2))\n'
              '        else:\n'
              '            print(f"decision: {action_review.decision}")\n'
              '            print(f"risk: {action_review.risk}")\n'
              '            for reason in action_review.reasons:\n'
              '                print(f"- {reason}")\n'
              '            if action_review.effects:\n'
              '                print(f"effects: {\", \".join(action_review.effects)}")\n'
              '            if action_review.safer_next_step:\n'
              '                print(f"safer_next_step: {action_review.safer_next_step}")\n'
              '        return _review_exit(args, action_review.decision)\n\n'
              '    if args.command_name == "doctor":\n',
          )

          replace_once(
              "ordin/entrypoint.py",
              '    "check",\n    "review",\n',
              '    "check",\n    "review",\n    "action",\n',
          )
          replace_once(
              ".pre-commit-config.yaml",
              '          ordin/api.py\n          ordin/policy.py\n',
              '          ordin/action.py\n          ordin/api.py\n          ordin/semantics.py\n          ordin/policy.py\n',
          )
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ordin/schema.py ordin/cli.py ordin/entrypoint.py .pre-commit-config.yaml
          git commit -m "Wire generic action review into CLI and schemas"
          git push origin HEAD:generic-action-review
